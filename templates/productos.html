{% extends "base.html" %}
{% block content %}

<h2>Productos</h2>

<h3>Agregar producto</h3>
<form action="/productos/agregar" method="POST">
    Nombre: <input type="text" name="nombre" required>
    Precio: <input type="number" step="0.01" name="precio" required>
    <button type="submit">Agregar</button>
</form>

<h3>Lista de productos</h3>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Acciones</th>
    </tr>
    {% for p in productos %}
    <tr>
        <td>{{ p[0] }}</td>
        <td>{{ p[1] }}</td>
        <td>${{ p[2] }}</td>
        <td>
            <a href="/productos/editar/{{ p[0] }}">Editar</a> |
            <a href="/productos/eliminar/{{ p[0] }}" onclick="return confirm('¿Eliminar producto?')">Eliminar</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
