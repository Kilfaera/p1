{% extends "base.html" %}
{% block content %}
<h2>Facturas</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Fecha</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Total</th>
    </tr>
    {% for f in facturas %}
    <tr>
        <td>{{ f[0] }}</td>
        <td>{{ f[1] }}</td>
        <td>{{ f[2] }}</td>
        <td>{{ f[3] }}</td>
        <td>${{ f[4] }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
